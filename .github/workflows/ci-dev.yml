name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          cd electron-app && npm ci
          cd ../react-app && npm ci
          cd ../telegram-service && npm ci

      - name: Lint
        run: |
          cd electron-app && npm run lint
          cd ../react-app && npm run lint

      - name: Test
        run: |
          cd electron-app && npm test

      - name: Build
        run: |
          cd react-app && npm run build
          cd ../electron-app && npm run build