name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint electron-app
        run: npm run lint --workspace=electron-app

      - name: Lint react-app
        run: npm run lint --workspace=react-app

      - name: Test
        run: npm test --workspace=electron-app

      - name: Build
        run: |
          npm run build --workspace=react-app
          npm run build --workspace=electron-app

